<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>终端迷局 · AIU Lab</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="AIU Lab 首页"><span class="brand-mark" aria-hidden="true">A</span><span>AIU <b>LAB</b></span></a>
    <nav class="page-nav" aria-label="功能导航"><a href="/" aria-current="page">文字冒险</a><a href="/yolo">视觉检测</a></nav>
    <span class="header-note">创智 · 综合演示</span>
  </header>
  <main id="main" class="workspace adventure-layout">
    <aside class="sidebar">
      <p class="eyebrow">INTERACTIVE ADVENTURE</p>
      <h1>终端迷局<span class="accent">.</span></h1>
      <p class="description">走进一间神秘实验室。用你的选择推动剧情，让模型成为这场冒险的叙述者。</p>
      <div class="side-card">
        <p class="card-label">模型连接</p>
        <p id="model-status" class="status-line" data-tone="neutral"><span class="status-dot" aria-hidden="true"></span><span id="model-status-text">检查中</span></p>
        <p id="model-name" class="muted small">正在读取服务状态</p>
        <p id="model-error" class="small error-text" hidden></p>
        <button id="check-connection" class="text-button" type="button">重新检查</button>
      </div>
      <div class="side-card">
        <p class="card-label">开始探索</p>
        <p class="muted small">描述你想做的事，或者从一个动作开始。</p>
        <div class="suggestions">
          <button class="suggestion" type="button" data-message="看看终端屏幕">看看终端屏幕 <span aria-hidden="true">↗</span></button>
          <button class="suggestion" type="button" data-message="检查实验室的门">检查实验室的门 <span aria-hidden="true">↗</span></button>
          <button class="suggestion" type="button" data-message="仔细搜查桌上的物品">搜查桌上的物品 <span aria-hidden="true">↗</span></button>
        </div>
      </div>
      <p class="sidebar-footer">你的进度会保留在当前浏览器会话中。</p>
    </aside>
    <section class="chat-panel" aria-label="冒险对话">
      <div class="panel-toolbar"><div><span class="live-dot" aria-hidden="true"></span><strong>冒险记录</strong><span id="turn-count" class="muted small">0 轮对话</span></div><button id="reset-btn" class="button button-quiet" type="button">重新开始</button></div>
      <div id="chat" role="log" aria-label="对话记录" aria-live="polite" aria-relevant="additions"></div>
      <div id="chat-error" class="notice notice-error chat-error" role="alert" hidden><span id="chat-error-text"></span><button id="retry-btn" class="text-button" type="button">重试这一步</button></div>
      <form id="input-form" class="composer">
        <label class="sr-only" for="input">你想做什么</label>
        <textarea id="input" name="message" rows="2" maxlength="4000" placeholder="你想做什么？" autocomplete="off" required></textarea>
        <button id="send-btn" class="button button-primary" type="submit"><span id="send-label">发送</span><span aria-hidden="true">↑</span></button>
        <div class="composer-footer"><span id="chat-state" role="status">Enter 发送 · Shift + Enter 换行</span><span id="char-count">0 / 4000</span></div>
      </form>
    </section>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
