<!DOCTYPE html>
<!-- 界面结构与交互入口；实际计算和状态由后端服务提供。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>视觉检测 · AIU Lab</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="AIU Lab 首页"><span class="brand-mark" aria-hidden="true">A</span><span>AIU <b>LAB</b></span></a>
    <nav class="page-nav" aria-label="功能导航"><a href="/showcase">二面展示台</a><a href="/">文字冒险</a><a href="/yolo" aria-current="page">视觉检测</a><a href="/research">科研工作台</a></nav>
    <span class="header-note">创智 · 综合演示</span>
  </header>
  <main id="main" class="workspace detection-layout">
    <aside class="sidebar">
      <p class="eyebrow">COMPUTER VISION</p>
      <h1>看见世界<span class="accent">.</span></h1>
      <p class="description">通过 YOLO 识别画面中的物体，查看预测框、类别与置信度。</p>
      <section class="side-card" aria-label="检测控制">
        <label class="card-label" for="source-select">画面来源</label>
        <select id="source-select" disabled><option>读取可用来源中…</option></select>
        <p id="source-help" class="muted small source-help">进入后自动启动摄像头；选择案例即可切换实时检测。</p>
        <div class="control-buttons"><button id="start-btn" class="button button-primary" type="button" disabled>启动检测 <span aria-hidden="true">▶</span></button><button id="stop-btn" class="button button-quiet" type="button" disabled>停止</button></div>
      </section>
      <section class="side-card" aria-label="运行信息">
        <p class="card-label">运行信息</p>
        <dl class="runtime-details"><div><dt>检测模型</dt><dd id="detection-model">—</dd></div><div><dt>当前来源</dt><dd id="active-source">—</dd></div></dl>
        <button id="refresh-btn" class="text-button" type="button">刷新状态</button><button id="view-btn" class="text-button" type="button" hidden>连接已有画面</button>
      </section>
      <p class="sidebar-footer">摄像头由当前运行应用的电脑提供。离开本页会释放本页启动的检测。</p>
    </aside>
    <section class="vision-panel" aria-label="检测预览">
      <div class="panel-toolbar"><strong>检测画面</strong><span id="detection-status" class="status-badge" data-tone="neutral">连接中</span></div>
      <div class="video-stage">
        <div id="video-placeholder" class="video-placeholder"><span class="viewfinder" aria-hidden="true">＋</span><h2 id="placeholder-title">实时检测</h2><p id="placeholder-description">正在连接摄像头…</p></div>
        <img id="video" alt="YOLO 物体检测结果，画面上显示预测框和类别" hidden />
        <span id="source-overlay" class="source-overlay" hidden></span>
      </div>
      <div class="metrics"><div><span>处理帧率</span><strong id="fps">—</strong></div><div><span>已处理帧</span><strong id="frame-count">0</strong></div><div><span>运行时间</span><strong id="elapsed">—</strong></div></div>
      <div class="vision-notices"><p id="yolo-msg" class="notice" role="status">正在连接检测服务…</p><p id="yolo-warning" class="notice notice-warning" role="status" hidden></p></div>
    </section>
  </main>
  <script type="module" src="/static/yolo.js?v=stage-live-20261013-c"></script>
</body>
</html>
